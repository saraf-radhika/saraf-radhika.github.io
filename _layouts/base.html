<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Radhika Saraf</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="alternate" type="application/atom+xml" title="Radhika Saraf — Blog" href="/feed.xml">
</head>
<body class="sub">
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a class="logo" href="/">RS<span>.</span></a>
      <nav>
        <a href="/#about">About</a>
        <a href="/#journey">Journey</a>
        <a href="/blog/">Blog</a>
        <a href="/#contact" class="nav-cta">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-foot">
    <div class="wrap footline">
      <span>&copy; {{ site.time | date: "%Y" }} Radhika Saraf</span>
      <span><a href="/feed.xml">RSS</a> · <a href="https://www.linkedin.com/in/radhika-s-4a91b566/" target="_blank" rel="noopener">LinkedIn</a></span>
    </div>
  </footer>
</body>
</html>
