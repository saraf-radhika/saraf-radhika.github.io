<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Radhika Saraf</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="alternate" type="application/atom+xml" title="Radhika Saraf — Blog" href="/feed.xml">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="home" href="/">Radhika Saraf</a>
      <nav><a href="/blog/">Blog</a><a href="/#about">About</a></nav>
    </header>
    {{ content }}
    <footer>
      <span>&copy; {{ site.time | date: "%Y" }} Radhika Saraf</span>
    </footer>
  </div>
</body>
</html>
