---
layout: base
---
<header class="page-hero post-hero">
  <div class="wrap">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="standfirst">{{ page.description }}</p>{% endif %}
  </div>
</header>
<article class="prose">
  {{ content }}
</article>
<p class="back"><a href="/blog/">&larr; All posts</a></p>
